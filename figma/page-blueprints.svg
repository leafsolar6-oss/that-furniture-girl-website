<text x="896" y="667" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8F93">Reviews section stays hidden until a real review exists.</text>
<text x="896" y="682" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8F93">Every figure on the page is real and verified.</text>
