<text x="896" y="592" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8F93">Ordering is WhatsApp only — no cart, no checkout.</text>
<text x="896" y="607" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8F93">No invented urgency: no countdowns, fake strikes,</text>
